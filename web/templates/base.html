<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JotPsych Outbound</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">JotPsych Outbound</div>
    <nav>
      <a href="{{ url_for('dashboard_view') }}"
         class="{{ 'active' if request.endpoint == 'dashboard_view' else '' }}">Dashboard</a>
      <a href="{{ url_for('upload_form') }}"
         class="{{ 'active' if request.endpoint in ['upload_form','upload_preview'] else '' }}">Upload</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{% for m in messages %}<div>{{ m }}</div>{% endfor %}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>Localhost only. Not secured. See the README security TODO before hosting.</footer>
</body>
</html>
